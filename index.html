<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEAF CicloRecreoVía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFC300;
    --bg-deep: #8A5A00;
    --panel: #FFF4D6;
    --ink: #3A2600;
    --ink-soft: #6B4B12;
    --app-color: #8A5A00;
    --app-color-dark: #603D00;
    --rrss-color: #FFD23F;
    --rrss-color-dark: #E0AE00;
    --gold-highlight: #FF9F00;
    --white-ish: #FFFDF5;
    --ok-green: #2f7a3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 85% -10%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, #FFB000 100%);
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* --- Header / signature --- */
  header{
    position:relative;
    text-align:center;
    padding:28px 10px 22px;
    overflow:hidden;
  }
  .sunwheel{
    position:absolute;
    top:50%; left:50%;
    width:340px; height:340px;
    transform:translate(-50%,-50%);
    opacity:0.16;
    z-index:0;
    animation: spin 60s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .sunwheel{animation:none;} }
  @keyframes spin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
  .eyebrow{
    position:relative; z-index:1;
    font-weight:800; letter-spacing:.22em; font-size:12px;
    text-transform:uppercase; color:var(--bg-deep); opacity:.75;
    margin:0 0 6px;
  }
  h1{
    position:relative; z-index:1;
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(28px, 8vw, 42px);
    line-height:1.05;
    margin:0;
    color:var(--ink);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.35);
  }

  /* --- Date selector --- */
  .selector-card{
    background:var(--panel);
    border-radius:18px;
    padding:14px 16px;
    margin:18px 0 22px;
    box-shadow:0 6px 18px rgba(58,38,0,0.12);
  }
  .selector-label{
    font-size:12px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; display:block;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--white-ish) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233A2600' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center / 16px;
    border:2px solid rgba(58,38,0,0.15);
    border-radius:12px;
    padding:14px 40px 14px 14px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:16px;
    color:var(--ink);
    cursor:pointer;
  }
  select:focus-visible{ outline:3px solid var(--gold-highlight); outline-offset:2px; }

  /* --- Buttons --- */
  .btn-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:8px;
  }
  .big-btn{
    border:none;
    border-radius:20px;
    padding:26px 10px 20px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    cursor:pointer;
    font-family:'Archivo Black', sans-serif;
    font-size:20px;
    letter-spacing:.03em;
    transition:transform .12s ease, box-shadow .12s ease;
    box-shadow:0 8px 0 rgba(0,0,0,0.18), 0 10px 20px rgba(0,0,0,0.15);
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.12); }
  .big-btn:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .big-btn svg{ width:52px; height:52px; }

  .btn-app{ background:var(--app-color); color:var(--white-ish); box-shadow:0 8px 0 var(--app-color-dark), 0 10px 20px rgba(0,0,0,0.15); }
  .btn-app:active{ box-shadow:0 2px 0 var(--app-color-dark), 0 4px 10px rgba(0,0,0,0.12); }
  .btn-rrss{ background:var(--rrss-color); color:var(--ink); box-shadow:0 8px 0 var(--rrss-color-dark), 0 10px 20px rgba(0,0,0,0.15); }
  .btn-rrss:active{ box-shadow:0 2px 0 var(--rrss-color-dark), 0 4px 10px rgba(0,0,0,0.12); }

  .toast{
    text-align:center;
    font-weight:700;
    font-size:14px;
    min-height:22px;
    margin:4px 0 18px;
    color:var(--ok-green);
    opacity:0;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  /* --- Summary cards --- */
  .total-card{
    background:var(--ink);
    color:var(--white-ish);
    border-radius:20px;
    padding:22px 20px;
    text-align:center;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(58,38,0,0.25);
  }
  .total-card .label{ font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.7; margin-bottom:6px; }
  .total-card .number-row{ display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap; }
  .total-card .big-number{ font-family:'Archivo Black', sans-serif; font-size:clamp(38px, 12vw, 56px); color:var(--gold-highlight); }
  .total-card .pct{ font-size:18px; font-weight:800; color:var(--white-ish); opacity:.85; }

  .split-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .mini-card{
    background:var(--panel);
    border-radius:16px;
    padding:16px;
    text-align:center;
    box-shadow:0 4px 12px rgba(58,38,0,0.1);
  }
  .mini-card .label{ font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
  .mini-card .value{ font-family:'Archivo Black', sans-serif; font-size:30px; color:var(--ink); }
  .mini-card.app .value{ color:var(--app-color); }
  .mini-card.rrss .value{ color:var(--rrss-color-dark); }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    opacity:.7;
    margin-top:22px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="sunwheel" viewBox="0 0 200 200">
      <g fill="none" stroke="#3A2600" stroke-width="3">
        <circle cx="100" cy="100" r="70"/>
        <circle cx="100" cy="100" r="14" fill="#3A2600"/>
        <g id="spokes"></g>
      </g>
    </svg>
    <p class="eyebrow">Registro de contacto</p>
    <h1>CHEAF<br>CicloRecreoVía</h1>
  </header>

  <div class="selector-card">
    <label class="selector-label" for="dateSelect">Ver registros de</label>
    <select id="dateSelect"></select>
  </div>

  <div class="btn-row">
    <button class="big-btn btn-app" id="btnApp" aria-label="Registrar contacto vía Aplicación">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="8" y="10" width="48" height="44" rx="6" fill="currentColor" opacity="0.18"/>
        <rect x="8" y="10" width="48" height="44" rx="6" stroke="currentColor" stroke-width="3"/>
        <line x1="8" y1="22" x2="56" y2="22" stroke="currentColor" stroke-width="3"/>
        <circle cx="15" cy="16" r="1.6" fill="currentColor"/>
        <circle cx="21" cy="16" r="1.6" fill="currentColor"/>
        <circle cx="27" cy="16" r="1.6" fill="currentColor"/>
        <rect x="16" y="30" width="32" height="5" rx="2.5" fill="currentColor"/>
        <rect x="16" y="40" width="20" height="5" rx="2.5" fill="currentColor"/>
      </svg>
      APP
    </button>
    <button class="big-btn btn-rrss" id="btnRrss" aria-label="Registrar contacto vía Redes Sociales">
      <svg viewBox="0 0 64 64" fill="none">
        <rect x="6" y="14" width="52" height="38" rx="6" fill="currentColor" opacity="0.12"/>
        <rect x="6" y="14" width="52" height="38" rx="6" stroke="currentColor" stroke-width="3"/>
        <circle cx="20" cy="26" r="4" fill="currentColor"/>
        <path d="M10 46 L24 32 L34 40 L44 28 L54 40" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      RRSS
    </button>
  </div>

  <p class="toast" id="toast"></p>

  <div class="total-card">
    <div class="label">Total de registros</div>
    <div class="number-row">
      <span class="big-number" id="totalNumber">0</span>
      <span class="pct" id="totalPct">(0% de logro)</span>
    </div>
  </div>

  <div class="split-row">
    <div class="mini-card app">
      <div class="label">Total APP</div>
      <div class="value" id="appTotal">0</div>
    </div>
    <div class="mini-card rrss">
      <div class="label">Total RRSS</div>
      <div class="value" id="rrssTotal">0</div>
    </div>
  </div>

  <footer id="footerNote">Actualizando datos…</footer>
</div>

<script>
  // ================= CONFIGURACIÓN =================
  // Reemplaza esta URL por la del Web App de Apps Script publicado
  // (ver instrucciones entregadas junto a este archivo).
  const CONFIG = {
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwM9-RfyLF_Zu5Pa_88Lmy82DnPk0JyF5fUB7oC07cF69PJFjSfpl73bGwhpqUWMNDe/exec',
    META: 500,
    REFRESH_MS: 30000
  };
  // ===================================================

  let rawData = []; // { fecha: Date, tipo: 'Aplicación' | 'Redes Sociales' }
  const dateSelect = document.getElementById('dateSelect');
  const toast = document.getElementById('toast');

  // Dibuja los rayos del sol/rueda decorativa
  (function drawSpokes(){
    const g = document.getElementById('spokes');
    const n = 16;
    for(let i=0;i<n;i++){
      const a = (i / n) * 2 * Math.PI;
      const x1 = 100 + Math.cos(a) * 20, y1 = 100 + Math.sin(a) * 20;
      const x2 = 100 + Math.cos(a) * 70, y2 = 100 + Math.sin(a) * 70;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      g.appendChild(line);
    }
  })();

  function showToast(msg, ok){
    toast.textContent = msg;
    toast.style.color = ok ? '#2f7a3c' : '#b3261e';
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function isSunday(d){ return d.getDay() === 0; }

  function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildOptions(){
    const prevValue = dateSelect.value;
    dateSelect.innerHTML = '';

    const optTotal = document.createElement('option');
    optTotal.value = 'total';
    optTotal.textContent = 'Total (todos los registros)';
    dateSelect.appendChild(optTotal);

    // Meses presentes
    const months = new Map(); // key -> label
    rawData.forEach(r => {
      const k = monthKey(r.fecha);
      if(!months.has(k)){
        const label = capitalize(r.fecha.toLocaleDateString('es-CL', { month:'long', year:'numeric' }));
        months.set(k, label);
      }
    });
    [...months.entries()].sort().forEach(([k,label])=>{
      const o = document.createElement('option');
      o.value = 'mes:'+k;
      o.textContent = label;
      dateSelect.appendChild(o);
    });

    // Fechas individuales (solo domingos)
    const days = new Map();
    rawData.filter(r => isSunday(r.fecha)).forEach(r=>{
      const k = dayKey(r.fecha);
      if(!days.has(k)){
        const label = 'Domingo ' + r.fecha.toLocaleDateString('es-CL', { day:'numeric', month:'long', year:'numeric' });
        days.set(k, label);
      }
    });
    [...days.entries()].sort().forEach(([k,label])=>{
      const o = document.createElement('option');
      o.value = 'fecha:'+k;
      o.textContent = capitalize(label);
      dateSelect.appendChild(o);
    });

    // Restaurar selección previa si sigue existiendo
    if(prevValue && [...dateSelect.options].some(o=>o.value===prevValue)){
      dateSelect.value = prevValue;
    }
  }

  function filteredData(){
    const v = dateSelect.value || 'total';
    if(v === 'total') return rawData;
    if(v.startsWith('mes:')){
      const k = v.slice(4);
      return rawData.filter(r => monthKey(r.fecha) === k);
    }
    if(v.startsWith('fecha:')){
      const k = v.slice(6);
      return rawData.filter(r => dayKey(r.fecha) === k);
    }
    return rawData;
  }

  function normalizeTipo(t){
    if(!t) return '';
    const s = t.toString().trim().toLowerCase();
    if(s.startsWith('aplic')) return 'app';
    if(s.startsWith('red')) return 'rrss';
    return '';
  }

  function render(){
    const rows = filteredData();
    const total = rows.length;
    const appCount = rows.filter(r => normalizeTipo(r.tipo) === 'app').length;
    const rrssCount = rows.filter(r => normalizeTipo(r.tipo) === 'rrss').length;

    document.getElementById('totalNumber').textContent = total;
    const pct = Math.round((total / CONFIG.META) * 100);
    document.getElementById('totalPct').textContent = '(' + pct + '% de logro)';
    document.getElementById('appTotal').textContent = appCount;
    document.getElementById('rrssTotal').textContent = rrssCount;
  }

  function loadData(){
    if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      document.getElementById('footerNote').textContent = 'Falta configurar la URL de Apps Script en CONFIG.APPS_SCRIPT_URL';
      return;
    }
    const callbackName = 'cheafCallback_' + Date.now();
    window[callbackName] = function(data){
      rawData = (data || [])
        .map(r => ({ fecha: new Date(r.fecha), tipo: r.tipo }))
        .filter(r => !isNaN(r.fecha.getTime()) && r.tipo);
      buildOptions();
      render();
      document.getElementById('footerNote').textContent =
        'Última actualización: ' + new Date().toLocaleTimeString('es-CL');
      delete window[callbackName];
      script.remove();
    };
    const script = document.createElement('script');
    script.src = CONFIG.APPS_SCRIPT_URL + '?callback=' + callbackName + '&t=' + Date.now();
    script.onerror = function(){
      document.getElementById('footerNote').textContent = 'No se pudo cargar la planilla (revisa la URL de Apps Script).';
    };
    document.body.appendChild(script);
  }

  function registrar(tipo, btnEl){
    if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      showToast('Falta configurar la URL de Apps Script', false);
      return;
    }
    btnEl.disabled = true;
    fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: tipo
    })
    .then(()=>{
      showToast('Registrado: ' + tipo, true);
      setTimeout(()=>{ loadData(); btnEl.disabled = false; }, 900);
    })
    .catch(()=>{
      showToast('No se pudo registrar. Intenta de nuevo.', false);
      btnEl.disabled = false;
    });
  }

  document.getElementById('btnApp').addEventListener('click', function(){
    registrar('Aplicación', this);
  });
  document.getElementById('btnRrss').addEventListener('click', function(){
    registrar('Redes Sociales', this);
  });
  dateSelect.addEventListener('change', render);

  buildOptions();
  render();
  loadData();
  setInterval(loadData, CONFIG.REFRESH_MS);
</script>
</body>
</html>
