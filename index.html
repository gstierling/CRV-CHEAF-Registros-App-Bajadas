<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CHEAF CicloRecreoVía</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FFC300;
    --bg-deep: #8A5A00;
    --panel: #FFF4D6;
    --ink: #3A2600;
    --ink-soft: #6B4B12;
    --app-color: #8A5A00;
    --app-color-dark: #603D00;
    --rrss-color: #FFD23F;
    --rrss-color-dark: #E0AE00;
    --gold-highlight: #FF9F00;
    --white-ish: #FFFDF5;
    --ok-green: #2f7a3c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 85% -10%, rgba(255,255,255,0.35), transparent 45%),
      linear-gradient(180deg, var(--bg) 0%, #FFB000 100%);
    font-family:'Manrope', sans-serif;
    color:var(--ink);
    padding:24px 16px 60px;
  }
  .wrap{max-width:640px;margin:0 auto;}

  /* --- Header / signature --- */
  header{
    position:relative;
    text-align:center;
    padding:28px 10px 22px;
    overflow:hidden;
  }
  .sunwheel{
    position:absolute;
    top:50%; left:50%;
    width:340px; height:340px;
    transform:translate(-50%,-50%);
    opacity:0.16;
    z-index:0;
    animation: spin 60s linear infinite;
  }
  @media (prefers-reduced-motion: reduce){ .sunwheel{animation:none;} }
  @keyframes spin{ from{transform:translate(-50%,-50%) rotate(0deg);} to{transform:translate(-50%,-50%) rotate(360deg);} }
  .eyebrow{
    position:relative; z-index:1;
    font-weight:800; letter-spacing:.22em; font-size:13px;
    text-transform:uppercase; color:var(--bg-deep); opacity:.75;
    margin:0 0 6px;
  }
  h1{
    position:relative; z-index:1;
    font-family:'Archivo Black', sans-serif;
    font-size:clamp(32px, 9vw, 48px);
    line-height:1.05;
    margin:0;
    color:var(--ink);
    text-shadow: 2px 2px 0 rgba(255,255,255,0.35);
  }

  /* --- Date selector --- */
  .selector-card{
    background:var(--panel);
    border-radius:18px;
    padding:11px 16px;
    margin:18px 0 22px;
    box-shadow:0 6px 18px rgba(58,38,0,0.12);
  }
  .selector-label{
    font-size:13px; font-weight:800; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:8px; display:block;
  }
  select{
    width:100%;
    appearance:none;
    -webkit-appearance:none;
    background:var(--white-ish) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233A2600' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>") no-repeat right 14px center / 16px;
    border:2px solid rgba(58,38,0,0.15);
    border-radius:12px;
    padding:11px 40px 11px 14px;
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:18px;
    color:var(--ink);
    cursor:pointer;
  }
  select:focus-visible{ outline:3px solid var(--gold-highlight); outline-offset:2px; }

  /* --- Slide-to-register bar --- */
  .slider-card{ margin-bottom:8px; }
  .slider-hint{
    text-align:center;
    font-size:13px;
    font-weight:800;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:0 0 8px;
  }
  .slide-track{
    position:relative;
    height:84px;
    border-radius:42px;
    display:flex;
    overflow:hidden;
    box-shadow:inset 0 2px 6px rgba(0,0,0,0.15), 0 6px 16px rgba(58,38,0,0.18);
    touch-action:none;
    user-select:none;
  }
  .slide-zone{
    width:50%;
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Archivo Black', sans-serif;
    font-size:20px;
    letter-spacing:.03em;
    transition:opacity .1s ease;
  }
  .slide-zone svg{ width:34px; height:34px; flex-shrink:0; }
  .zone-app{
    background:var(--app-color);
    color:var(--white-ish);
    justify-content:flex-start;
    padding-left:22px;
    opacity:.55;
  }
  .zone-rrss{
    background:var(--rrss-color);
    color:var(--ink);
    justify-content:flex-end;
    padding-right:22px;
    opacity:.55;
  }
  .slide-handle{
    position:absolute;
    top:6px; left:50%;
    width:72px; height:72px;
    margin-left:-36px;
    border-radius:50%;
    background:var(--white-ish);
    box-shadow:0 4px 10px rgba(0,0,0,0.25);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:grab;
    will-change:transform;
    touch-action:none;
  }
  .slide-handle:active{ cursor:grabbing; }
  .slide-handle.dragging{ transition:none; }
  .slide-handle:not(.dragging){ transition:transform .28s cubic-bezier(.2,.8,.3,1); }
  .slide-handle:focus-visible{ outline:3px solid var(--ink); outline-offset:3px; }
  .slide-handle svg{ width:26px; height:26px; }
  .slide-handle .arrows{ color:var(--ink-soft); animation:nudge 1.8s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .slide-handle .arrows{ animation:none; } }
  @keyframes nudge{ 0%,100%{ transform:translateX(0);} 50%{ transform:translateX(3px);} }

  .toast{
    text-align:center;
    font-weight:700;
    font-size:15px;
    min-height:22px;
    margin:4px 0 18px;
    color:var(--ok-green);
    opacity:0;
    transition:opacity .25s ease;
  }
  .toast.show{ opacity:1; }

  /* --- Summary cards --- */
  .total-card{
    background:var(--ink);
    color:var(--white-ish);
    border-radius:20px;
    padding:18px 20px;
    text-align:center;
    margin-bottom:14px;
    box-shadow:0 6px 18px rgba(58,38,0,0.25);
  }
  .total-card .label{ font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; opacity:.7; margin-bottom:6px; }
  .total-card .number-row{ display:flex; align-items:baseline; justify-content:center; gap:10px; flex-wrap:wrap; }
  .total-card .big-number{ font-family:'Archivo Black', sans-serif; font-size:clamp(42px, 13vw, 62px); color:var(--gold-highlight); }
  .total-card .pct{ font-size:20px; font-weight:800; color:var(--white-ish); opacity:.85; }

  .split-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  .mini-card{
    background:var(--panel);
    border-radius:16px;
    padding:13px;
    text-align:center;
    box-shadow:0 4px 12px rgba(58,38,0,0.1);
  }
  .mini-card .label{ font-size:12px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px; }
  .mini-card .value{ font-family:'Archivo Black', sans-serif; font-size:34px; color:var(--ink); }
  .mini-card.app .value{ color:var(--app-color); }
  .mini-card.rrss .value{ color:var(--rrss-color-dark); }

  footer{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    opacity:.7;
    margin-top:22px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <svg class="sunwheel" viewBox="0 0 200 200">
      <g fill="none" stroke="#3A2600" stroke-width="3">
        <circle cx="100" cy="100" r="70"/>
        <circle cx="100" cy="100" r="14" fill="#3A2600"/>
        <g id="spokes"></g>
      </g>
    </svg>
    <p class="eyebrow">Registro de contacto</p>
    <h1>CHEAF<br>CicloRecreoVía</h1>
  </header>

  <div class="selector-card">
    <label class="selector-label" for="dateSelect">Ver registros de</label>
    <select id="dateSelect"></select>
  </div>

  <div class="slider-card">
    <p class="slider-hint">Desliza hasta el extremo para registrar</p>
    <div class="slide-track" id="slideTrack">
      <div class="slide-zone zone-app" id="zoneApp">
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="8" y="10" width="48" height="44" rx="6" fill="currentColor" opacity="0.18"/>
          <rect x="8" y="10" width="48" height="44" rx="6" stroke="currentColor" stroke-width="3"/>
          <line x1="8" y1="22" x2="56" y2="22" stroke="currentColor" stroke-width="3"/>
          <circle cx="15" cy="16" r="1.6" fill="currentColor"/>
          <circle cx="21" cy="16" r="1.6" fill="currentColor"/>
          <circle cx="27" cy="16" r="1.6" fill="currentColor"/>
          <rect x="16" y="30" width="32" height="5" rx="2.5" fill="currentColor"/>
          <rect x="16" y="40" width="20" height="5" rx="2.5" fill="currentColor"/>
        </svg>
        <span>APP</span>
      </div>
      <div class="slide-zone zone-rrss" id="zoneRrss">
        <span>RRSS</span>
        <svg viewBox="0 0 64 64" fill="none">
          <rect x="6" y="14" width="52" height="38" rx="6" fill="currentColor" opacity="0.12"/>
          <rect x="6" y="14" width="52" height="38" rx="6" stroke="currentColor" stroke-width="3"/>
          <circle cx="20" cy="26" r="4" fill="currentColor"/>
          <path d="M10 46 L24 32 L34 40 L44 28 L54 40" stroke="currentColor" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="slide-handle" id="slideHandle" tabindex="0" role="slider"
           aria-label="Deslizar a la izquierda para registrar Aplicación, o a la derecha para registrar Redes Sociales"
           aria-valuemin="-1" aria-valuemax="1" aria-valuenow="0">
        <svg class="arrows" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 6 L3 12 L9 18"/>
          <path d="M15 6 L21 12 L15 18"/>
        </svg>
      </div>
    </div>
  </div>

  <p class="toast" id="toast"></p>

  <div class="total-card">
    <div class="label">Total de registros</div>
    <div class="number-row">
      <span class="big-number" id="totalNumber">0</span>
      <span class="pct" id="totalPct">(0% de logro)</span>
    </div>
  </div>

  <div class="split-row">
    <div class="mini-card app">
      <div class="label">Total APP</div>
      <div class="value" id="appTotal">0</div>
    </div>
    <div class="mini-card rrss">
      <div class="label">Total RRSS</div>
      <div class="value" id="rrssTotal">0</div>
    </div>
  </div>

  <footer id="footerNote">Actualizando datos…</footer>
</div>

<script>
  // ================= CONFIGURACIÓN =================
  // Reemplaza esta URL por la del Web App de Apps Script publicado
  // (ver instrucciones entregadas junto a este archivo).
  const CONFIG = {
    APPS_SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwM9-RfyLF_Zu5Pa_88Lmy82DnPk0JyF5fUB7oC07cF69PJFjSfpl73bGwhpqUWMNDe/exec',
    META: 500,
    REFRESH_MS: 30000
  };
  // ===================================================

  let rawData = []; // { fecha: Date, tipo: 'Aplicación' | 'Redes Sociales', id?: string }
  let pendingRecords = []; // registros optimistas aún no confirmados por el servidor
  const dateSelect = document.getElementById('dateSelect');
  const toast = document.getElementById('toast');

  // Dibuja los rayos del sol/rueda decorativa
  (function drawSpokes(){
    const g = document.getElementById('spokes');
    const n = 16;
    for(let i=0;i<n;i++){
      const a = (i / n) * 2 * Math.PI;
      const x1 = 100 + Math.cos(a) * 20, y1 = 100 + Math.sin(a) * 20;
      const x2 = 100 + Math.cos(a) * 70, y2 = 100 + Math.sin(a) * 70;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',x1); line.setAttribute('y1',y1);
      line.setAttribute('x2',x2); line.setAttribute('y2',y2);
      g.appendChild(line);
    }
  })();

  function showToast(msg, ok){
    toast.textContent = msg;
    toast.style.color = ok ? '#2f7a3c' : '#b3261e';
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function isSunday(d){ return d.getDay() === 0; }

  function monthKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
  function dayKey(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function buildOptions(){
    const prevValue = dateSelect.value;
    dateSelect.innerHTML = '';

    const optTotal = document.createElement('option');
    optTotal.value = 'total';
    optTotal.textContent = 'Total (todos los registros)';
    dateSelect.appendChild(optTotal);

    // Meses presentes
    const months = new Map(); // key -> label
    rawData.forEach(r => {
      const k = monthKey(r.fecha);
      if(!months.has(k)){
        const label = capitalize(r.fecha.toLocaleDateString('es-CL', { month:'long', year:'numeric' }));
        months.set(k, label);
      }
    });
    [...months.entries()].sort().forEach(([k,label])=>{
      const o = document.createElement('option');
      o.value = 'mes:'+k;
      o.textContent = label;
      dateSelect.appendChild(o);
    });

    // Fechas individuales (solo domingos)
    const days = new Map();
    rawData.filter(r => isSunday(r.fecha)).forEach(r=>{
      const k = dayKey(r.fecha);
      if(!days.has(k)){
        const label = 'Domingo ' + r.fecha.toLocaleDateString('es-CL', { day:'numeric', month:'long', year:'numeric' });
        days.set(k, label);
      }
    });
    [...days.entries()].sort().forEach(([k,label])=>{
      const o = document.createElement('option');
      o.value = 'fecha:'+k;
      o.textContent = capitalize(label);
      dateSelect.appendChild(o);
    });

    // Restaurar selección previa si sigue existiendo
    if(prevValue && [...dateSelect.options].some(o=>o.value===prevValue)){
      dateSelect.value = prevValue;
    }
  }

  function filteredData(){
    const v = dateSelect.value || 'total';
    if(v === 'total') return rawData;
    if(v.startsWith('mes:')){
      const k = v.slice(4);
      return rawData.filter(r => monthKey(r.fecha) === k);
    }
    if(v.startsWith('fecha:')){
      const k = v.slice(6);
      return rawData.filter(r => dayKey(r.fecha) === k);
    }
    return rawData;
  }

  function normalizeTipo(t){
    if(!t) return '';
    const s = t.toString().trim().toLowerCase();
    if(s.startsWith('aplic')) return 'app';
    if(s.startsWith('red')) return 'rrss';
    return '';
  }

  function render(){
    const rows = filteredData();
    const total = rows.length;
    const appCount = rows.filter(r => normalizeTipo(r.tipo) === 'app').length;
    const rrssCount = rows.filter(r => normalizeTipo(r.tipo) === 'rrss').length;

    document.getElementById('totalNumber').textContent = total;
    const pct = Math.round((total / CONFIG.META) * 100);
    document.getElementById('totalPct').textContent = '(' + pct + '% de logro)';
    document.getElementById('appTotal').textContent = appCount;
    document.getElementById('rrssTotal').textContent = rrssCount;
  }

  function loadData(){
    if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      document.getElementById('footerNote').textContent = 'Falta configurar la URL de Apps Script en CONFIG.APPS_SCRIPT_URL';
      return;
    }
    const callbackName = 'cheafCallback_' + Date.now();
    window[callbackName] = function(data){
      const serverData = (data || [])
        .map(r => ({ fecha: new Date(r.fecha), tipo: r.tipo, id: r.id }))
        .filter(r => !isNaN(r.fecha.getTime()) && r.tipo);

      // Un registro optimista se retira de "pendientes" únicamente cuando su id exacto
      // ya aparece en los datos del servidor (no por comparar cantidades, que puede
      // fallar y dejar registros fantasma duplicados en el dashboard).
      const serverIds = new Set(serverData.map(r => r.id).filter(Boolean));
      pendingRecords = pendingRecords.filter(r => !serverIds.has(r.id));
      rawData = serverData.concat(pendingRecords);

      buildOptions();
      render();
      document.getElementById('footerNote').textContent =
        'Última actualización: ' + new Date().toLocaleTimeString('es-CL');
      delete window[callbackName];
      script.remove();
    };
    const script = document.createElement('script');
    script.src = CONFIG.APPS_SCRIPT_URL + '?callback=' + callbackName + '&t=' + Date.now();
    script.onerror = function(){
      document.getElementById('footerNote').textContent = 'No se pudo cargar la planilla (revisa la URL de Apps Script).';
    };
    document.body.appendChild(script);
  }

  let slideLocked = false;

  function generateId(){
    if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  }

  function registrar(tipo){
    if(!CONFIG.APPS_SCRIPT_URL || CONFIG.APPS_SCRIPT_URL.indexOf('PEGA_AQUI') === 0){
      showToast('Falta configurar la URL de Apps Script', false);
      return;
    }
    // Actualización optimista: refleja el registro de inmediato en los 3 recuadros,
    // sin esperar la respuesta de red, para que no haya duda de que se registró.
    // Lleva su propio id único, que es el mismo que se envía al servidor: así, al
    // sincronizar, se puede confirmar con exactitud si el servidor ya lo tiene.
    const regId = generateId();
    const optimisticRecord = { fecha: new Date(), tipo: tipo, id: regId };
    rawData.push(optimisticRecord);
    pendingRecords.push(optimisticRecord);
    buildOptions();
    render();
    showToast('Registrado: ' + tipo, true);

    fetch(CONFIG.APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ tipo: tipo, id: regId })
    })
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(!data || data.ok !== true){
        throw new Error(data && data.error ? data.error : 'El servidor no confirmó el registro');
      }
      // Sincroniza con la planilla poco después, por si hay otros dispositivos registrando a la vez.
      // El propio loadData() se encarga de no descontar este registro hasta confirmar que el
      // servidor ya lo tiene.
      setTimeout(loadData, 4000);
    })
    .catch(function(err){
      // Si falló el envío (o el servidor respondió ok:false), se revierte el conteo optimista
      let idx = rawData.indexOf(optimisticRecord);
      if(idx > -1) rawData.splice(idx, 1);
      idx = pendingRecords.indexOf(optimisticRecord);
      if(idx > -1) pendingRecords.splice(idx, 1);
      buildOptions();
      render();
      showToast('No se pudo registrar' + (err && err.message ? (': ' + err.message) : ''), false);
    });
  }

  // --- Barra deslizante (slide-to-confirm) ---
  const slideTrack = document.getElementById('slideTrack');
  const slideHandle = document.getElementById('slideHandle');
  const zoneApp = document.getElementById('zoneApp');
  const zoneRrss = document.getElementById('zoneRrss');
  const THRESHOLD_RATIO = 0.82; // hay que arrastrar el 82% del recorrido para que se registre

  let maxOffset = 0;
  let dragging = false;
  let startX = 0;
  let currentOffset = 0;
  let pointerId = null;

  function computeMaxOffset(){
    const trackWidth = slideTrack.clientWidth;
    const handleWidth = slideHandle.offsetWidth;
    maxOffset = (trackWidth - handleWidth) / 2 - 6; // pequeño margen interno
  }
  window.addEventListener('resize', computeMaxOffset);

  function setHandle(offset){
    slideHandle.style.transform = 'translateX(' + offset + 'px)';
    const ratio = maxOffset ? (offset / maxOffset) : 0;
    zoneApp.style.opacity = 0.55 + Math.max(0, -ratio) * 0.45;
    zoneRrss.style.opacity = 0.55 + Math.max(0, ratio) * 0.45;
    slideHandle.setAttribute('aria-valuenow', ratio.toFixed(2));
  }

  function resetHandle(){
    currentOffset = 0;
    setHandle(0);
  }

  function onPointerDown(e){
    // Ignora toques adicionales (multitáctil, palma de la mano) mientras ya hay un arrastre en curso
    if(slideLocked || dragging) return;
    computeMaxOffset();
    dragging = true;
    pointerId = e.pointerId;
    slideHandle.classList.add('dragging');
    startX = e.clientX - currentOffset;
    slideHandle.setPointerCapture(pointerId);
  }

  function onPointerMove(e){
    if(!dragging || e.pointerId !== pointerId) return;
    let offset = e.clientX - startX;
    offset = Math.max(-maxOffset, Math.min(maxOffset, offset));
    currentOffset = offset;
    setHandle(offset);
  }

  function onPointerUp(e){
    if(!dragging || e.pointerId !== pointerId) return;
    dragging = false;
    pointerId = null;
    slideHandle.classList.remove('dragging');
    const ratio = maxOffset ? (currentOffset / maxOffset) : 0;

    if(ratio <= -THRESHOLD_RATIO){
      slideLocked = true;
      setHandle(-maxOffset);
      registrar('Aplicación');
      setTimeout(()=>{ resetHandle(); slideLocked = false; }, 500);
    } else if(ratio >= THRESHOLD_RATIO){
      slideLocked = true;
      setHandle(maxOffset);
      registrar('Redes Sociales');
      setTimeout(()=>{ resetHandle(); slideLocked = false; }, 500);
    } else {
      resetHandle();
    }
  }

  slideHandle.addEventListener('pointerdown', onPointerDown);
  slideHandle.addEventListener('pointermove', onPointerMove);
  slideHandle.addEventListener('pointerup', onPointerUp);
  slideHandle.addEventListener('pointercancel', onPointerUp);

  // Accesibilidad: flechas de teclado para quien no puede arrastrar
  slideHandle.addEventListener('keydown', function(e){
    if(slideLocked) return;
    if(e.key === 'ArrowLeft'){
      registrar('Aplicación');
      slideLocked = true;
      setTimeout(()=>{ slideLocked = false; }, 500);
    } else if(e.key === 'ArrowRight'){
      registrar('Redes Sociales');
      slideLocked = true;
      setTimeout(()=>{ slideLocked = false; }, 500);
    }
  });

  computeMaxOffset();
  dateSelect.addEventListener('change', render);

  buildOptions();
  render();
  loadData();
  setInterval(loadData, CONFIG.REFRESH_MS);
</script>
</body>
</html>
